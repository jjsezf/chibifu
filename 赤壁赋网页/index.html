<html lang="zh-CN">
<head>

<title>赤壁赋 · 学习雅集</title>
<style>
  :root {
    --ink: #2c2825;

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {

    color: var(--ink);
    line-height: 1.9;
    overflow-x: hidden;
  }

  /* 首页 */
  #home-view {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: opacity 0.4s ease;
  }

  .hero-title {
    text-align: center;
    margin-bottom: 50px;
  }

  .hero-title h1 {
    font-size: 36px;
    letter-spacing: 8px;
    color: var(--ink);
    font-weight: normal;
    position: relative;
    display: inline-block;

  /* 这里就是修改后的“苏轼”小框框 */
  .sub-title {
    display: block;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--cinnabar);
    margin-top: 10px;
    border: 1px solid var(--cinnabar);
    padding: 2px 10px;
    border-radius: 20px;
    width: fit-content;
    margin: 10px auto 0;
    font-family: "Songti SC", serif;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .menu-card {
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    position: relative;
    overflow: hidden;
  }

  .menu-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(158, 47, 47, 0.05) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .menu-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    border-color: var(--cinnabar);
  }
  .menu-card:hover::before { opacity: 1; }

  .menu-card .chapter-no {
    font-size: 13px;
    color: var(--cinnabar);
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: block;
  }
  .menu-card h2 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
  }

  /* 详情页视图 */
  #detail-view {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--paper);
    z-index: 10;
    overflow-y: auto;
    overflow-x: hidden;
    display: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    -webkit-overflow-scrolling: touch;
  }

  .top-bar {
    position: fixed;
    top: 0; left: 0; width: 100%;
    height: 56px;
    background: rgba(246, 241, 230, 0.9);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 20;
    border-bottom: 1px solid var(--line);
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    padding: 8px;
  }
  .back-btn svg { width: 20px; height: 20px; }

  .detail-title {
    flex: 1;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-right: 30px;
  }

  .detail-content {
    max-width: 800px;
    margin: 0 auto;
    padding: 80px 20px 60px;
  }

  .img-container {
    width: 100%;
    height: 220px;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 30px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    position: relative;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .img-container:active {
    transform: scale(0.98);
  }

  .img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .image-preview {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .image-preview.show { display: flex; opacity: 1; }
  .image-preview img {
    max-width: 95%;
    max-height: 90%;
    object-fit: contain;
    border-radius: 4px;
  }

  .text-content h3 {
    font-size: 20px;
    color: var(--cinnabar);
    margin: 30px 0 15px;
    padding-left: 12px;
    border-left: 4px solid var(--cinnabar);
    letter-spacing: 1px;
  }

  .text-content p {
    font-size: 16px;
    color: var(--ink-light);
    margin-bottom: 18px;
    text-align: justify;
    line-height: 2;
  }

  .text-content strong { color: var(--ink); font-weight: bold; }

  .quote-box {
    background: rgba(232, 223, 205, 0.5);
    padding: 20px;
    border-radius: 8px;
    border: 1px dashed var(--line);
    margin: 20px 0;
    font-size: 15.5px;
    color: var(--ink);
    white-space: pre-wrap;
    line-height: 2.1;
    text-align: justify;
  }

  .text-content ul { padding-left: 20px; margin-bottom: 20px; }
  .text-content li { font-size: 16px; color: var(--ink-light); margin-bottom: 10px; }
  .text-content li strong { color: var(--cinnabar); }

  @media (max-width: 600px) {
    .menu-grid { grid-template-columns: 1fr; }
    .hero-title h1 { font-size: 28px; }
    .img-container { height: 200px; }
    .detail-content { padding: 70px 16px 40px; }
  }
</style>
</head>

        <h3>时代背景</h3>

        <h3>原文</h3>
        <div class="quote-box">壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。

苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭，是造物者之无尽藏也，而吾与子之所共适。”

        <h3>白话译文</h3>
        <div class="quote-box">壬戌年秋天，七月十六，我和友人在赤壁之下泛舟游玩。清风缓缓吹来，水面波澜平静。举起酒杯劝友人饮酒，吟诵《明月》诗篇，歌唱“窈窕”的篇章。没过多久，明月从东山升起，在斗宿、牛宿之间缓缓徘徊。白茫茫水汽铺满江面，水光与天际连成一片。任凭小船随意飘荡，越过浩渺无边的万顷江面。浩浩荡荡仿佛乘风凌空飞翔，不知道停留在何处；飘飘然如同脱离尘世，飞升成仙。

我神色变得忧伤，整理衣襟端正坐好，问客人：“箫声为什么这样悲凉？”

客人说：“‘月明星稀，乌鹊南飞’，这不是曹操的诗句吗？向西望见夏口，向东望见武昌，山水盘绕，草木苍翠，这不正是曹操被周瑜围困的地方？当年他攻破荆州，拿下江陵，顺江东下，战船绵延千里，旗帜遮蔽天空，面对大江饮酒，横握长矛吟诗，本是一代英雄，如今又在哪里呢？何况我与你，在江边沙洲捕鱼砍柴，把鱼虾当作伴侣，把麋鹿当作朋友；驾一叶小船，举起葫芦酒杯互相劝酒。我们如同蜉蝣寄身广阔天地，渺小得像大海里一粒米粒。哀叹我们生命短暂，羡慕长江无穷无尽。想要同仙人遨游，与明月永世相伴。知道这不可能轻易得到，只好把悲凉箫声寄托给秋风。”

    viewImg.src = data.image;
    viewText.innerHTML = data.text;

    homeView.style.opacity = '0';
    setTimeout(() => {
      homeView.style.display = 'none';
      detailView.style.display = 'block';
      detailView.scrollTop = 0; 
      void detailView.offsetWidth; 
      detailView.style.opacity = '1';
    }, 300);
  }

  function closeDetail() {
    detailView.style.opacity = '0';
    setTimeout(() => {
      detailView.style.display = 'none';
      homeView.style.display = 'flex';
      void homeView.offsetWidth;
      homeView.style.opacity = '1';
    }, 300);
  }

  function togglePreview(imgBox) {
    const imgSrc = imgBox.querySelector('img').src;
    previewImg.src = imgSrc;
    previewLayer.classList.add('show');
  }

  function closePreview() {
    previewLayer.classList.remove('show');
  }
</script>

</body>
</html>
